<!doctype html>
<!-- Содержит полноэкранную HTML-оболочку редактора уровней Sokoban. -->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Редактор уровней Sokoban</title>
    <link rel="stylesheet" href="./src/editor.css" />
  </head>
  <body>
    <div class="editor-shell">
      <header class="editor-header">
        <div class="editor-heading-group">
          <div class="editor-title">
            <span class="editor-title__eyebrow">Sokoban tools</span>
            <h1>Редактор уровней</h1>
          </div>
          <div class="editor-tools">
            <span class="editor-tools__title">Инструменты</span>
            <button id="fill-button" class="editor-button editor-button--compact editor-fill-button" type="button" title="Залить выбранным тайлом" aria-label="Залить выбранным тайлом" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m4 12 7.5-7.5L19 12l-7.5 7.5L4 12Z" />
                <path d="m7.5 8.5 7 7" />
                <path d="M20 16.5c0 1.1-.9 2-2 2s-2-.9-2-2c0-.8 1.1-2.3 2-3.5.9 1.2 2 2.7 2 3.5Z" />
              </svg>
            </button>
          </div>
        </div>
        <label class="editor-field">
          <span>Локация</span>
          <select id="location-select"></select>
        </label>
        <label class="editor-field editor-field--level">
          <span>Уровень</span>
          <select id="level-select"></select>
        </label>
        <div class="editor-actions">
          <button
            id="reset-button"
            class="editor-button editor-button--compact editor-button--danger"
            type="button"
            title="Отменить все изменения"
          >
            🗑
          </button>
          <button id="undo-button" class="editor-button editor-button--compact" type="button" title="Отменить (Ctrl+Z)">↶</button>
          <button id="redo-button" class="editor-button editor-button--compact" type="button" title="Повторить (Ctrl+Shift+Z)">↷</button>
          <button id="validate-button" class="editor-button editor-button--secondary" type="button">Проверить</button>
          <button id="launch-button" class="editor-button editor-button--launch" type="button">Запустить черновик</button>
          <button id="save-button" class="editor-button editor-button--primary" type="button">Сохранить</button>
        </div>
      </header>

      <aside class="editor-sidebar">
        <div class="editor-sidebar__heading">
          <span class="editor-sidebar__caption">Инструмент</span>
          <strong id="brush-label">Выберите кисть</strong>
        </div>
        <div class="editor-sidebar-tabs" role="tablist" aria-label="Режим редактора">
          <button id="manual-tools-tab" type="button" role="tab" aria-selected="true">Редактирование</button>
          <button id="generator-tab" type="button" role="tab" aria-selected="false">Автогенерация</button>
        </div>
        <div id="manual-tools-panel" role="tabpanel">
          <div id="utility-palette" class="editor-utility-palette"></div>
          <div id="mode-tabs" class="editor-mode-tabs"></div>
          <div id="palette" class="editor-palette"></div>
        </div>
        <section id="generator-panel" class="editor-generator" role="tabpanel" hidden></section>
        <section class="editor-validation">
          <div class="editor-sidebar__caption">Проверка структуры</div>
          <div id="validation-summary" class="editor-validation__summary"></div>
        </section>
        <div class="editor-help">
          <p>Левая кнопка ставит выбранный тайл сразу вместе с его текстурой. Правая кнопка стирает клетку.</p>
          <p>Клавиши 1–4 переключают стены, ящики, пол и цели. Колесо мыши меняет масштаб поля.</p>
        </div>
      </aside>

      <main class="editor-workspace">
        <div id="canvas-host" class="editor-canvas-host"></div>
        <div id="empty-state" class="editor-empty-state" hidden>В локации нет уровней</div>
        <output id="status" class="editor-status" aria-live="polite"></output>
      </main>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
