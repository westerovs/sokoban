<!doctype html>
<!-- Содержит полноэкранную HTML-оболочку редактора уровней Sokoban. -->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Редактор уровней Sokoban</title>
    <link rel="stylesheet" href="./src/editor.css" />
  </head>
  <body>
    <dialog
      id="fill-location-dialog"
      class="editor-confirm-dialog"
      aria-labelledby="fill-location-title"
      aria-describedby="fill-location-message"
    >
      <h2 id="fill-location-title">Заливка всей локации</h2>
      <p id="fill-location-message"></p>
      <div class="editor-confirm-dialog__actions">
        <button id="fill-location-cancel" class="editor-button" type="button" autofocus>Отмена</button>
        <button id="fill-location-apply" class="editor-button editor-fill-button--location" type="button">Применить</button>
      </div>
    </dialog>
    <div class="editor-shell">
      <header class="editor-header">
        <label class="editor-field">
          <span>Локация</span>
          <select id="location-select"></select>
        </label>
        <label class="editor-field editor-field--level">
          <span>Уровень</span>
          <select id="level-select"></select>
        </label>
        <div class="editor-tools">
          <span class="editor-tools__title">Инструменты</span>
          <div class="editor-tools__buttons">
            <button
              id="fill-button"
              class="editor-button editor-button--compact editor-fill-button"
              type="button"
              title="Залить выбранным тайлом"
              aria-label="Залить выбранным тайлом"
              disabled
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m4 12 7.5-7.5L19 12l-7.5 7.5L4 12Z" />
                <path d="m7.5 8.5 7 7" />
                <path d="M20 16.5c0 1.1-.9 2-2 2s-2-.9-2-2c0-.8 1.1-2.3 2-3.5.9 1.2 2 2.7 2 3.5Z" />
              </svg>
            </button>
            <button
              id="fill-location-button"
              class="editor-button editor-button--compact editor-fill-button editor-fill-button--location"
              type="button"
              title="заливка всех уровней на локации"
              aria-label="заливка всех уровней на локации"
              disabled
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m4 12 7.5-7.5L19 12l-7.5 7.5L4 12Z" />
                <path d="m7.5 8.5 7 7" />
                <path d="M20 16.5c0 1.1-.9 2-2 2s-2-.9-2-2c0-.8 1.1-2.3 2-3.5.9 1.2 2 2.7 2 3.5Z" />
              </svg>
            </button>
          </div>
        </div>
        <div class="editor-actions">
          <button
            id="reset-button"
            class="editor-button editor-button--compact editor-button--danger"
            type="button"
            title="Отменить все изменения"
          >
            🗑
          </button>
          <button id="undo-button" class="editor-button editor-button--compact" type="button" title="Отменить (Ctrl+Z)">↶</button>
          <button id="redo-button" class="editor-button editor-button--compact" type="button" title="Повторить (Ctrl+Shift+Z)">↷</button>
          <button id="validate-button" class="editor-button editor-button--secondary" type="button">Проверить</button>
          <button id="launch-button" class="editor-button editor-button--launch" type="button" title="Запустить черновик">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14l11-7Z" />
            </svg>
            <span>Черновик</span>
          </button>
          <button
            id="save-button"
            class="editor-button editor-button--primary editor-button--icon"
            type="button"
            title="Сохранить"
            aria-label="Сохранить"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 3h12l2 2v16H5Z" />
              <path d="M8 3v6h8V3M8 21v-8h8v8" />
            </svg>
          </button>
        </div>
      </header>

      <aside class="editor-sidebar">
        <div class="editor-sidebar-tabs" role="tablist" aria-label="Режим редактора">
          <button id="manual-tools-tab" type="button" role="tab" aria-selected="true">Редактирование</button>
          <button id="generator-tab" type="button" role="tab" aria-selected="false">Автогенерация</button>
        </div>
        <div id="manual-tools-panel" role="tabpanel">
          <div id="utility-palette" class="editor-utility-palette"></div>
          <h2 class="editor-palette__title">Структуры</h2>
          <div id="mode-tabs" class="editor-mode-tabs"></div>
          <div id="palette" class="editor-palette"></div>
        </div>
        <section id="generator-panel" class="editor-generator" role="tabpanel" hidden></section>
      </aside>

      <main class="editor-workspace">
        <div id="canvas-host" class="editor-canvas-host"></div>
        <div id="empty-state" class="editor-empty-state" hidden>В локации нет уровней</div>
        <output id="status" class="editor-status" aria-live="polite"></output>
      </main>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
